<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>버튼을 화면 중앙에 배치하기</title>
  <style>
    /* Do it! 버튼을 화면 중앙에 배치하기 */
    * {
      margin:0;
      box-sizing: border-box;
    }
    body {      
      background:url('images/bg5.jpg') no-repeat left top fixed;
      background-size:cover;   
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;   /*플렉스 컨테이너의 높이는 내용만큼 인식하므로
      화면 중앙에 배치하려면 플렉스 컨테이너의 높이를 뷰포트 높이로 지정해야 함
      최소 높이를 뷰포트 높이 전체로 지정*/
    }
    button {
      background-color:#ccc;
      font-size: 1.2em; 
      padding:1em 2em;
      border:none;
      border-radius:5px;    
      box-shadow:1px 1px 2px #fff;  
    }
  </style>  
</head>
<body>
  <button>클릭!</button>             
</body>
</html>
